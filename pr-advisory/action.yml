name: Máquina PR advisory
description: Run Máquina's precompiled, observe-only PR operational advisory inside a GitHub Actions runner.
author: Máquina

inputs:
  github-token:
    description: GitHub token with read-only pull-request, checks, and contents access.
    required: true
  evidence-output:
    description: Repository-relative directory for sanitized evidence output.
    required: false
    default: .maquina/local/evidence-export
  repository-root:
    description: Repository-relative directory containing the trusted base revision and Factory Contract.
    required: false
    default: .
  checks:
    description: Newline-separated completed workflow evidence in NAME=CONCLUSION form.
    required: false
    default: ""
  publish-comment:
    description: Create or update the one marked operational-advisory comment on a trusted same-repository PR.
    required: false
    default: "false"

outputs:
  evidence-json:
    description: Repository-relative path to the sanitized JSON evidence record.
    value: ${{ steps.advisory.outputs.evidence-json }}
  evidence-markdown:
    description: Repository-relative path to the sanitized Markdown evidence record.
    value: ${{ steps.advisory.outputs.evidence-markdown }}
  comment-action:
    description: "Comment publication result: disabled, suppressed, created, or updated."
    value: ${{ steps.advisory.outputs.comment-action }}

runs:
  using: composite
  steps:
    - id: advisory
      name: Run Máquina advisory
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        MAQUINA_EVIDENCE_OUTPUT: ${{ inputs.evidence-output }}
        MAQUINA_REPOSITORY_ROOT: ${{ inputs.repository-root }}
        MAQUINA_CHECKS: ${{ inputs.checks }}
        MAQUINA_PUBLISH_COMMENT: ${{ inputs.publish-comment }}
      run: |
        set -euo pipefail
        if [[ "${GITHUB_EVENT_NAME:-}" != "pull_request" ]]; then
          echo "Máquina PR advisory requires a pull_request event." >&2
          exit 2
        fi

        if [[ "$MAQUINA_REPOSITORY_ROOT" = /* || "$MAQUINA_REPOSITORY_ROOT" = *".."* ]]; then
          echo "repository-root must be a safe repository-relative path." >&2
          exit 2
        fi
        repository_root="$GITHUB_WORKSPACE/$MAQUINA_REPOSITORY_ROOT"
        test -f "$repository_root/.maquina/factory-contract.json"

        args=(github actions advise --event "$GITHUB_EVENT_PATH" --evidence-output "$MAQUINA_EVIDENCE_OUTPUT")
        while IFS= read -r check; do
          [[ -z "$check" ]] && continue
          args+=(--check "$check")
        done <<< "$MAQUINA_CHECKS"

        "$GITHUB_ACTION_PATH/bin/maquina-linux-amd64" "${args[@]}" "$repository_root"

        evidence_root="$repository_root/$MAQUINA_EVIDENCE_OUTPUT/evidence"
        mapfile -t json_records < <(find "$evidence_root" -type f -name '*.json' -print | sort)
        mapfile -t markdown_records < <(find "$evidence_root" -type f -name '*.md' -print | sort)
        if [[ "${#json_records[@]}" -ne 1 || "${#markdown_records[@]}" -ne 1 ]]; then
          echo "Expected exactly one sanitized JSON and Markdown evidence record." >&2
          exit 1
        fi
        printf 'evidence-json=%s\n' "${json_records[0]#"$GITHUB_WORKSPACE/"}" >> "$GITHUB_OUTPUT"
        printf 'evidence-markdown=%s\n' "${markdown_records[0]#"$GITHUB_WORKSPACE/"}" >> "$GITHUB_OUTPUT"

        if [[ "$MAQUINA_PUBLISH_COMMENT" != "true" ]]; then
          echo "comment-action=disabled" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        same_repository="$(python3 -c 'import json, sys; event = json.load(open(sys.argv[1], encoding="utf-8")); head = event.get("pull_request", {}).get("head", {}).get("repo") or {}; repository = event.get("repository", {}); print("true" if head.get("full_name") == repository.get("full_name") else "false")' "$GITHUB_EVENT_PATH")"
        if [[ "$same_repository" != "true" ]]; then
          echo "Máquina comment publication is suppressed for fork pull requests."
          echo "comment-action=suppressed" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        comment_output="$("$GITHUB_ACTION_PATH/bin/maquina-linux-amd64" github actions comment \
          --input "${json_records[0]#"$repository_root/"}" \
          --trusted-same-repository \
          "$repository_root")"
        printf '%s\n' "$comment_output"
        case "$comment_output" in
          *"comment created"*) echo "comment-action=created" >> "$GITHUB_OUTPUT" ;;
          *"comment updated"*) echo "comment-action=updated" >> "$GITHUB_OUTPUT" ;;
          *)
            echo "Máquina comment publisher returned an unrecognized result." >&2
            exit 1
            ;;
        esac
